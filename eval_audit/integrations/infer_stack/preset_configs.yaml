# Benchmark-bundle preset catalog (PRESET_CONFIGS data).
#
# This YAML is the data half of eval_audit/integrations/infer_stack/presets.py:
# presets.py loads it once at import via yaml.safe_load into the PRESET_CONFIGS
# name, then appends the dynamically-composed 'allenai-olmo-combined' preset.
# Keep it round-trip-safe under yaml.safe_load (all scalars are quoted so that
# version-like strings, 'none', and comma-lists stay strings).

