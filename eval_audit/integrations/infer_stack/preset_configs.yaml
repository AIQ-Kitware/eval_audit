    - 'gpqa:subset=gpqa_main,use_chain_of_thought=true,use_few_shot=false,num_output_tokens=2048,model=allenai/olmoe-1b-7b-0125-instruct'
    - 'ifeval:num_output_tokens=2048,model=allenai/olmoe-1b-7b-0125-instruct'
    - 'mmlu_pro:subject=all,use_chain_of_thought=true,use_few_shot=false,num_output_tokens=2048,model=allenai/olmoe-1b-7b-0125-instruct'
    'suite': 'audit-allenai-olmoe-1b-7b-0125-instruct-full'
    'precomputed_root': '/data/crfm-helm-public'
    'max_eval_instances': 1000
    # Containerized HELM ("docker pipeline") is mandatory; the grid passes
    # `eval-audit-run --container-image "$OLMO_CONTAINER_IMAGE"`.
    # network=host so the in-container
    # HELM client reaches the host-served model (vLLM behind LiteLLM);
    # gpus=none keeps HELM off the serving GPUs (these MC/exact-match
    # entries have no local-HF judge model). See docs/container-execution.md.
    'container_network': 'host'
    'hf_cache_dir': '~/.cache/eval-audit-hf'
    'container_gpus': 'none'

# ── Classic-era (pre-v0.5) replay presets ────────────────────────────────────
# One preset PER ERA (not per scenario): the two scenarios have different logical
# run keys, so a single per-era experiment composes cleanly (unlike the phi-2
# e2e, whose three variants of ONE scenario would pool into a single packet).
# Era replay is verbatim by-name: NO model_deployment_name (there is no
# adapter_spec.model_deployment to rewrite pre-v0.5) and NO helm_tokenizer_name
# (the era WindowService, keyed on the official model name, reproduces official
# tokenization). `era` routes the exporter to the era shim client + schema and
# stamps the manifest so the bridge selects the era pipeline + guards the image
# label. See docs/planning/era-tests-dev-runbook-plan.md and
# docs/planning/era-pinned-helm-containers-plan.md.
#
# IMPORTANT: `precomputed_root` below is the broad classic root, which is
# AMBIGUOUS for pythia-6.9b (its runs exist under BOTH v0.2.4 and v0.3.0 with
# identical run-dir names, so --freeze-rel-paths would fail AMBIGUOUS). The
# runbook OVERRIDES it with `--precomputed-root <per-era suite-scoped view>`
# (dev/era-tests/_lib.sh :: era_corpus_view) so each era freezes exactly its own
# suite. The default is left broad (not a bogus per-era path) so a bare export
# fails loud (AMBIGUOUS) rather than silently pinning the wrong suite.
