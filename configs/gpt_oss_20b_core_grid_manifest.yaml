schema_version: 1
experiment_name: audit-gpt-oss-20b-core-grid
description: >
  gpt-oss-20b on the 14 core benchmarks shared with pythia-6.9b and vicuna-7b-v1.3,
  enabling cross-model comparison beyond the classic HELM corpus.
  The runnable repro flow uses reproduce/gpt_oss_20b_core_grid/05_write_bundle.sh
  to generate a machine-local LiteLLM-backed manifest.
