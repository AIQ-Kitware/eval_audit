schema_version: 1
name: e2e-phi2-vllm
description: >
  The comparable vLLM baseline phi-2 e2e scenario as its OWN virtual experiment
  (phi-2 served on vLLM behind LiteLLM; mmlu:subject=philosophy, eval_split=test).
  Composed alone — one local recipe — so it pairs cleanly with the public
  microsoft/phi-2 mmlu:philosophy run by canonical logical key, instead of pooling
  with the other phi-2 scenarios into a single packet. Sibling per-scenario
  manifests: e2e-phi2-incomparable, e2e-phi2-hf, e2e-phi2-container.

scope:
  models:
    - "regex:^microsoft/phi-2"

sources:
  - kind: audit_index
    fpath: /data/crfm-helm-audit-store/indexes/audit_results_index.csv
    include_experiments:
      - e2e-phi_2-vllm-philosophy-full

  # Public comparison side: match the local run against the public HELM row by
  # canonical logical key (requires the public index + Stage-1 filter inventory).
  - kind: official_public_index
    fpath: /data/crfm-helm-audit-store/indexes/official_public_index.csv
    pre_filter:
      kind: helm_stage1
      inventory_fpath: /data/crfm-helm-audit-store/analysis/filter_inventory.json

output:
  root: /data/crfm-helm-audit-store/virtual-experiments/e2e-phi2-vllm
