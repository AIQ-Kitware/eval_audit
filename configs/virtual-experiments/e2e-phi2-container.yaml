schema_version: 1
name: e2e-phi2-container
description: >
  The containerized phi-2 e2e example as a virtual experiment, running HELM
  inside the pinned eval-audit-helm-runner image (Stage 3 containerized
  execution): phi-2 is served on the host (vLLM behind LiteLLM) and HELM runs in
  the container, reaching the LiteLLM endpoint via --network host. Produced by the
  opt-in vllm-container target of the dev/e2e-tests grid (E2E_INCLUDE_CONTAINER=1).
  Local-only by default: comparability facts a public counterpart would supply
  collapse to status=unknown and surface as comparability_unknown:* warnings —
  expected.

scope:
  models:
    - "regex:^microsoft/phi-2"

sources:
  - kind: audit_index
    fpath: /data/crfm-helm-audit-store/indexes/audit_results_index.csv
    include_experiments:
      - e2e-phi_2-vllm-philosophy-container-full
      # To demonstrate that containerized execution reproduces the host-venv run,
      # also run the host grid and add its counterpart here:
      #   - e2e-phi_2-vllm-philosophy-full

  # Optional comparison side. Uncomment to compare against public HELM rows
  # (requires the public index + Stage-1 filter inventory to exist).
  # - kind: official_public_index
  #   fpath: /data/crfm-helm-audit-store/indexes/official_public_index.csv
  #   pre_filter:
  #     kind: helm_stage1
  #     inventory_fpath: /data/crfm-helm-audit-store/analysis/filter_inventory.json

output:
  root: /data/crfm-helm-audit-store/virtual-experiments/e2e-phi2-container
