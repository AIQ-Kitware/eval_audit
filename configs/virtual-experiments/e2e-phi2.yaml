schema_version: 1
name: e2e-phi2
description: >
  The three phi-2 e2e scenarios grouped into one virtual experiment: the
  comparable vLLM baseline, the temperature=1 "incomparable" negative control,
  and the HuggingFace-direct deployment. Each runs its full manifest
  (<name>-full); the smoke grid is a preflight only and is not folded in here
  (see e2e-phi2-smoke.yaml for that). Compares against public HELM rows via the
  official_public_index source below: the baseline / HF-direct / container
  scenarios match the public microsoft/phi-2 mmlu:philosophy run by canonical
  logical key, so each gets an official_vs_local comparison. The temperature=1
  "incomparable" scenario deliberately deviates the recipe and so has no public
  match (the planner flags it per-packet) — the intended negative control.

scope:
  # All three scenarios run microsoft/phi-2. The include_experiments list below
  # is the hard bound; this regex is a second, defensive narrowing on the model
  # axis.
  models:
    - "regex:^microsoft/phi-2"

sources:
  - kind: audit_index
    fpath: /data/crfm-helm-audit-store/indexes/audit_results_index.csv
    include_experiments:
      - e2e-phi_2-vllm-philosophy-full
      - e2e-phi_2-vllm-philosophy-incomparable-full
      - e2e-phi_2-huggingface-philosophy-full

  # Public comparison side: compare the local full runs against public HELM rows.
  # The baseline / HF-direct / container scenarios all share the same recipe
  # (model=microsoft/phi-2, mmlu:subject=philosophy, eval_split=test) and match
  # the public microsoft/phi-2 mmlu:philosophy run by canonical logical key; the
  # temperature=1 "incomparable" scenario deliberately does NOT match (its recipe
  # deviates), which is the intended negative control.
  - kind: official_public_index
    fpath: /data/crfm-helm-audit-store/indexes/official_public_index.csv
    pre_filter:
      kind: helm_stage1
      inventory_fpath: /data/crfm-helm-audit-store/analysis/filter_inventory.json

output:
  root: /data/crfm-helm-audit-store/virtual-experiments/e2e-phi2
