schema_version: 1
name: e2e-phi2
description: >
  The three phi-2 e2e scenarios grouped into one virtual experiment: the
  comparable vLLM baseline, the temperature=1 "incomparable" negative control,
  and the HuggingFace-direct deployment. Each runs its full manifest
  (<name>-full); the smoke grid is a preflight only and is not folded in here
  (see e2e-phi2-smoke.yaml for that). Local-only by default: there is no
  official_public_index source, so the report is the union of the three local
  full runs re-stamped under a single experiment name. Comparability facts that
  the planner would otherwise derive from a public counterpart collapse to
  status=unknown and surface as comparability_unknown:* warnings — expected for a
  local-only batch, not a bug. The incomparable scenario additionally deviates
  the recipe (temperature=1), which the planner flags per-packet.

scope:
  # All three scenarios run microsoft/phi-2. The include_experiments list below
  # is the hard bound; this regex is a second, defensive narrowing on the model
  # axis.
  models:
    - "regex:^microsoft/phi-2"

sources:
  - kind: audit_index
    fpath: /data/crfm-helm-audit-store/indexes/audit_results_index.csv
    include_experiments:
      - e2e-phi_2-vllm-philosophy-full
      - e2e-phi_2-vllm-philosophy-incomparable-full
      - e2e-phi_2-huggingface-philosophy-full

  # Optional comparison side. Uncomment to compare the local full runs against
  # public HELM rows (requires the public index + Stage-1 filter inventory to
  # exist).
  # - kind: official_public_index
  #   fpath: /data/crfm-helm-audit-store/indexes/official_public_index.csv
  #   pre_filter:
  #     kind: helm_stage1
  #     inventory_fpath: /data/crfm-helm-audit-store/analysis/filter_inventory.json

output:
  root: /data/crfm-helm-audit-store/virtual-experiments/e2e-phi2
