schema_version: 1
name: era-pythia-v030
description: >
  Classic-era (pre-v0.5) replay packet: eleutherai/pythia-6.9b @ helm-v0.3.0
  (synthetic_reasoning_natural:easy + mmlu:us_foreign_policy), composed alone and
  paired against the OFFICIAL classic v0.3.0 runs. same_deployment resolves
  'unknown' for era pairs (a pre-v0.5 adapter_spec has no model_deployment field)
  — expected, not a bug. Sibling per-era manifest: era-pythia-v024.

scope:
  models:
    - "regex:^eleutherai/pythia-6\\.9b$"

sources:
  - kind: audit_index
    fpath: /data/crfm-helm-audit-store/indexes/audit_results_index.csv
    include_experiments:
      - era-pythia_6_9b-v0_3_0-full

  # Public comparison side, scoped to THIS era's suite (see era-pythia-v024.yaml
  # for why the runbook builds a per-era official index).
  - kind: official_public_index
    fpath: /data/crfm-helm-audit-store/indexes/era-tests/v0.3.0/official_public_index.csv
    pre_filter:
      kind: helm_stage1
      inventory_fpath: /data/crfm-helm-audit-store/analysis/era-tests/v0.3.0/filter_inventory.json

output:
  root: /data/crfm-helm-audit-store/virtual-experiments/era-pythia-v030
