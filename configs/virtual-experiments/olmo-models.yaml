schema_version: 1
name: olmo-models
description: >
  Full local-reproduction batches for the six AllenAI OLMo presets, grouped into
  one virtual experiment. Each preset runs its complete candidate run-entry set
  (audit-<preset>-full); the smoke grid is a preflight only and is not folded in
  here. Comparison against public HELM is ON (the official_public_index source
  below): each of the six local full runs is paired with its official counterpart
  by logical run key. Comment that source out to make the report local-only — the
  planner then disables comparisons with missing_official_component.

scope:
  # Matches olmo / olmo-1.7 / olmo-2 / olmoe served-model names. The
  # include_experiments list below is the hard bound; this regex is a
  # second, defensive narrowing on the model axis.
  models:
    - "regex:^allenai/olmo"

sources:
  - kind: audit_index
    fpath: /data/crfm-helm-audit-store/indexes/audit_results_index.csv
    include_experiments:
      - audit-allenai-olmoe-1b-7b-0125-instruct-full
      # olmo-7b split into two from-spec experiments (full-MMLU + HELM-Lite suites)
      - audit-allenai-olmo-7b-mmlu-full
      - audit-allenai-olmo-7b-lite-full
      - audit-allenai-olmo-1-7-7b-full
      - audit-allenai-olmo-2-1124-7b-instruct-full
      - audit-allenai-olmo-2-1124-13b-instruct-full
      - audit-allenai-olmo-2-0325-32b-instruct-full

  # Comparison side: pair each local full run with its official public-HELM run by
  # logical run key (requires the public index + Stage-1 filter inventory to exist).
  # Comment out to make the report local-only.
  - kind: official_public_index
    fpath: /data/crfm-helm-audit-store/indexes/official_public_index.csv
    pre_filter:
      kind: helm_stage1
      inventory_fpath: /data/crfm-helm-audit-store/analysis/filter_inventory.json

output:
  root: /data/crfm-helm-audit-store/virtual-experiments/olmo-models
