model_deployments:
  # Base (pre-trained) model => legacy completions client, NOT the chat client.
  # This matches how the base Qwen1.5 officials were served (completions via
  # TogetherClient); the post-trained Qwen3.5-9B would instead use VLLMChatClient.
  - name: vllm/qwen3.5-9b-base-local
    model_name: qwen/qwen3.5-9b-base
    tokenizer_name: qwen/qwen3.5-9b-base
    max_sequence_length: 32768
    client_spec:
      class_name: "helm.clients.vllm_client.VLLMClient"
      args:
        base_url: "http://localhost:8000/v1"
        vllm_model_name: "Qwen/Qwen3.5-9B-Base"
