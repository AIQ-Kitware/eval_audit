# HELM registry sidecar: shipped into prod_env via the manifest's
# tokenizer_configs_fpath (see model_metadata.yaml alongside).
tokenizer_configs:
  - name: qwen/qwen3.5-9b-base
    tokenizer_spec:
      class_name: "helm.tokenizers.huggingface_tokenizer.HuggingFaceTokenizer"
      args:
        pretrained_model_name_or_path: Qwen/Qwen3.5-9B-Base
    # Base-model EOT convention mirrors qwen/qwen1.5-7b (chat variants use <|im_end|>).
    end_of_text_token: "<|endoftext|>"
    prefix_token: ""
