# HELM registry sidecar for the OPEN-WEIGHT JUDGE models used by the
# open-judge experiment (docs/planning/open-judge-plan.md Phase 10 / §15).
# Shipped into the HELM runner via register_configs_from_directory so
# neither id needs an edit to HELM itself. These are the CHAT/instruct
# checkpoints (not -Base) — they are used purely as judges, never as
# candidates; a Qwen judge must never wear an official GPT-4o/Llama name.
#
# num_parameters / release_date are informational only (leaderboard
# metadata, not load-bearing for the experiment). Values below are best
# estimates from the model cards; CONFIRM against the HF repos before a
# publication-grade run. num_parameters for the MoE judge is the TOTAL
# parameter count (active is ~3B).
models:
  # --- Judge-size sweep: the Qwen3.5 post-trained ladder ---------------
  # All post-trained (instruct) checkpoints, never the -Base variants: a
  # judge must follow the tagged-output instruction. Same family and
  # post-training recipe across the ladder, so agreement-vs-size is
  # attributable to capacity.
  - name: qwen/qwen3.5-0.8b
    display_name: Qwen3.5 0.8B
    description: Qwen3.5 0.8B is the smallest post-trained (instruct) dense model of the Qwen3.5 family. Used as an open-weight judge in the judge-size sweep. ([HF](https://huggingface.co/Qwen/Qwen3.5-0.8B))
    creator_organization_name: Qwen
    access: open
    num_parameters: 800000000     # approximate; confirm against the HF repo
    release_date: 2026-03-02      # Qwen3.5 family; confirm
    tags: [TEXT_MODEL_TAG, FULL_FUNCTIONALITY_TEXT_MODEL_TAG, INSTRUCTION_FOLLOWING_MODEL_TAG]
  - name: qwen/qwen3.5-2b
    display_name: Qwen3.5 2B
    description: Qwen3.5 2B is a post-trained (instruct) dense model of the Qwen3.5 family. Used as an open-weight judge in the judge-size sweep. ([HF](https://huggingface.co/Qwen/Qwen3.5-2B))
