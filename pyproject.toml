[build-system]
# uv_build is uv's native PEP 517 backend — drops editable install
# time from 30-60s (setuptools' build_editable walking the tree and
# generating _distutils_hack shims) to under a second. Trade-off:
# only `uv pip install` understands the metadata; plain `pip install`
# still works (it falls back to PEP 660 generic editable handling).
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "14 days"  # Can also use ISO format like "P14D"

[project]
name = "eval-audit"
version = "0.0.1"
description = "Python-first HELM audit and reproducibility workflow"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "crfm-helm>=0.5.8",
    # IM-10: dacite/fsspec/h5py/kwarray/lazy_loader/msgspec/numexpr/pygtrie/
    # ruamel.yaml/scikit-learn/typing-extensions are NOT imported by eval_audit
    # itself. They mirror submodules/aiq-magnet/pyproject.toml (the vendored
    # MAGNeT backend, which imports most of them at runtime) so the audit
    # environment can run the MAGNeT backend without a separate install. Kept as
    # explicit pins for that submodule rather than pruned. Marked below.
    "dacite>=1.9.2",  # pinned for aiq-magnet
    "every_eval_ever",
    "fsspec>=2024.9.0",  # pinned for aiq-magnet
    "h5py>=3.14.0",  # pinned for aiq-magnet
    # transformers 5.x breaks the HELM->EEE rebuild (is_offline_mode removal),
    # zeroing Stage-5 analysis; huggingface-hub must match HELM's pin. Do not
    # relax these without re-validating the from-spec rebuild path.
    "huggingface-hub==0.36.2",
    "kaleido>=1.0.0",
    "kwarray>=0.7.1",  # pinned for aiq-magnet
    "kwutil>=0.3.8",
    "lazy_loader>=0.4",  # pinned for aiq-magnet
    "loguru>=0.7.3",
    "matplotlib>=3.8",
    "msgspec>=0.19.0",  # pinned for aiq-magnet
    "networkx>=3.0",
    "numexpr>=2.11.0",  # pinned for aiq-magnet
    "numpy>=1.26",
    "orjson>=3.10.15",
    "pandas>=2.2.3",
    "plotly>=6.0.0",
    "pygtrie>=2.5.0",  # pinned for aiq-magnet
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "ruamel.yaml>=0.17.22",  # pinned for aiq-magnet
    "safer>=4.0.0",
    "scikit-learn>=1.7.1",  # pinned for aiq-magnet
    "scriptconfig>=0.8.4",
    "seaborn>=0.13",
    "transformers<5",
    "typing-extensions>=4.0.0",  # pinned for aiq-magnet
    "ubelt>=1.3.8",
]

[tool.uv.sources]
every_eval_ever = { path = "submodules/every_eval_ever", editable = true }


# HELM plugins: helm-run calls load_entry_point_plugins(group="helm") after it
# registers its built-in + prod_env configs, so this module's registrations
# override matching built-in entries (e.g. repointing the allenai/olmo-7b
# tokenizer alias at the transformers-native -hf repo). See eval_audit/integrations/helm_plugins.py.
[project.entry-points.helm]
eval-audit-tokenizer-overrides = "eval_audit.integrations.helm_plugins"


[project.scripts]
# Every console script resolves to a thin wrapper in eval_audit.cli.*;
# business logic lives in the domain packages (workflows/, reports/, ...).
# Runbooks that invoke `python -m eval_audit.workflows.X` keep working
# because the library modules retain their main() functions.
eval-audit-check-env = "eval_audit.cli.check_env:main"
eval-audit-make-manifest = "eval_audit.cli.manifests:main"
eval-audit-run = "eval_audit.cli.run:main"
eval-audit-index = "eval_audit.cli.index:main"
eval-audit-index-historic = "eval_audit.cli.index_historic_helm_runs:main"
eval-audit-compare-pair = "eval_audit.cli.compare_pair:main"
eval-audit-compare-batch = "eval_audit.cli.compare_batch:main"
eval-audit-report-core = "eval_audit.cli.report_core:main"
eval-audit-report-aggregate = "eval_audit.cli.report_aggregate:main"
eval-audit-rebuild-core = "eval_audit.cli.rebuild_core:main"
eval-audit-analyze-experiment = "eval_audit.cli.analyze_experiment:main"
eval-audit-analyze-many = "eval_audit.cli.analyze_many:main"
eval-audit-build-summary = "eval_audit.cli.build_summary:main"
eval-audit-portfolio-status = "eval_audit.cli.portfolio_status:main"
eval-audit-analyze-index-snapshot = "eval_audit.cli.analyze_index_snapshot:main"
eval-audit-prepare-eee = "eval_audit.cli.prepare_eee:main"
eval-audit-build-virtual-experiment = "eval_audit.cli.build_virtual_experiment:main"
eval-audit-from-eee = "eval_audit.cli.from_eee:main"
eval-audit-compare-pair-eee = "eval_audit.cli.compare_pair_eee:main"

[tool.uv.build-backend]
# Flat layout: the package lives at the repo root as ``eval_audit/``,
# not under ``src/``. Without this override, uv_build defaults to
# ``src`` and would fail to find the module.
module-root = ""
module-name = "eval_audit"

[tool.pytest.ini_options]
# Collect tests from these roots only. Without this, pytest walks the entire
# repo, including old-backup-reports/, reports/, dev/, submodules/, etc.,
# which adds minutes to collection.
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow; deselected by default (pass --run-slow to include). Exercises matplotlib/plotly rendering, sankey HTML/PNG generation, or end-to-end summary builds.",
]
# Belt-and-suspenders: explicitly skip directories pytest should never enter
# even when invoked with a custom path or when conftest discovery walks up.
norecursedirs = [
  ".git",
  ".cache",
  ".claude",
  ".venv",
  ".venv13",
  ".venv313",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "__pycache__",
  "*.egg-info",
  "build",
  "dist",
  "configs",
  "dev",
  "docs",
  "examples",
  "in-progress-notes",
  "node_modules",
  "old-backup-reports",
  "reports",
  "reports-filter-bak",
  "reports-old",
  "reports-summary-bak",
  "reproduce",
  "submodules",
  "tmp",
]
