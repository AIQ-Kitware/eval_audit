schema_version: 1
name: classic-together-v024
description: >
  Classic-era (pre-v0.5) era-pinned replay @ helm-v0.2.4 of GPT-J 6B,
  GPT-NeoX 20B, and OPT 66B — all official runs — composed and paired against the
  OFFICIAL classic v0.2.4 runs. same_deployment resolves 'unknown' for era pairs
  (a pre-v0.5 adapter_spec has no model_deployment field) — expected, not a bug.
  Sibling per-era manifest: classic-together-v030.

scope:
  models:
    - "regex:^together/gpt-j-6b$"
    - "regex:^together/gpt-neox-20b$"
    - "regex:^together/opt-66b$"

sources:
  - kind: audit_index
    fpath: /data/crfm-helm-audit-store/indexes/audit_results_index.csv
    include_experiments:
      - era-gptj_6b-v0_2_4-full
      - era-gptneox_20b-v0_2_4-full
      - era-opt_66b-v0_2_4-full

  # Public comparison side, scoped to THIS era's suite. The canonical
  # official_public_index.csv has ZERO classic-track rows, so the runbook's
  # 25_index_official_classic.sh emits a per-era official index + filter
  # inventory (eval-audit-index-historic --suite_pattern v0.2.4). Per-era keeps a
  # v0.2.4 local run from pairing against a v0.3.0 official (identical keys across
  # suites otherwise).
  - kind: official_public_index
    fpath: /data/crfm-helm-audit-store/indexes/classic-together/v0.2.4/official_public_index.csv
    pre_filter:
      kind: helm_stage1
      inventory_fpath: /data/crfm-helm-audit-store/analysis/classic-together/v0.2.4/filter_inventory.json

output:
  root: /data/crfm-helm-audit-store/virtual-experiments/classic-together-v024
