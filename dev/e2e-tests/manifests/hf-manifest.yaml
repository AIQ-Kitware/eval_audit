schema_version: 1
experiment_name: e2e-phi_2-huggingface-philosophy
description: e2e test with Microsoft Phi-2 model deployed from huggingface
run_entries:
- mmlu:subject=philosophy,method=multiple_choice_joint,model=microsoft/phi-2,eval_split=test
max_eval_instances: 1000
suite: e2e-phi_2-huggingface-philosophy
mode: compute_if_missing
materialize: symlink
backend: tmux
devices: '0'
tmux_workers: 1
local_path: prod_env
precomputed_root:
require_per_instance_stats: true
#model_deployments_fpath: /data/crfm-helm-audit-store/local-bundles/gpt_oss_20b_core_grid/model_deployments.yaml
enable_huggingface_models: ["microsoft/phi-2"]
enable_local_huggingface_models: []
